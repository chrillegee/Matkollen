<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Min Matdagbok</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c85a2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Matdagbok">
<link rel="apple-touch-icon" href="icon-192.svg">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f2; --surface: #ffffff; --surface2: #f5f0e8;
    --accent: #c85a2a; --accent2: #e8845a; --green: #3a7d5a;
    --green-light: #e8f4ed; --red: #c84040; --text: #1a1410;
    --text2: #6b5e52; --border: #e8e0d4; --shadow: 0 2px 16px rgba(30,20,10,0.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); font-family:'DM Sans',sans-serif; color:var(--text); min-height:100vh; }
  /* Safe area for iPhone notch/Dynamic Island */
  header {
    padding-top: max(18px, env(safe-area-inset-top));
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
  }
  .history-section { padding-bottom: max(80px, calc(60px + env(safe-area-inset-bottom))); }
  .settings-btn { bottom: max(22px, calc(16px + env(safe-area-inset-bottom))); }

  header {
    background:var(--accent); padding:18px 20px; position:sticky; top:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 2px 20px rgba(200,90,42,0.3);
  }
  header h1 { font-family:'Fraunces',serif; font-size:20px; color:#fff; font-weight:600; }
  .date-nav { display:flex; align-items:center; gap:8px; }
  .date-nav button {
    background:rgba(255,255,255,0.2); border:none; color:#fff;
    width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:16px;
    display:flex; align-items:center; justify-content:center;
  }
  #currentDate { color:#fff; font-size:13px; font-weight:500; min-width:120px; text-align:center; }

  .points-card {
    margin:16px 14px 0; background:var(--surface); border-radius:18px;
    padding:18px; box-shadow:var(--shadow); border:1px solid var(--border);
  }
  .points-stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .stat-box { background:var(--surface2); border-radius:12px; padding:12px 8px; text-align:center; }
  .stat-box .val { font-family:'Fraunces',serif; font-size:26px; font-weight:600; }
  .stat-box .lbl { font-size:11px; color:var(--text2); margin-top:2px; }
  .stat-box.budget .val { color:var(--accent); }
  .stat-box.left .val { color:var(--green); }
  .stat-box.left.over .val { color:var(--red); }
  .progress-wrap { margin-top:14px; background:var(--surface2); border-radius:99px; height:9px; overflow:hidden; }
  .progress-bar { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--accent2),var(--accent)); transition:width 0.4s; max-width:100%; }
  .progress-bar.over { background:linear-gradient(90deg,#e87070,var(--red)); }

  .bonus-strip {
    margin:10px 14px 0; background:var(--green-light); border:1px solid #b8dfc9;
    border-radius:12px; padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
  }
  .bonus-text { font-size:13px; color:var(--green); font-weight:500; }
  .bonus-text span { font-family:'Fraunces',serif; font-size:17px; font-weight:600; display:block; }
  .bonus-btn {
    background:var(--green); color:#fff; border:none; border-radius:99px;
    padding:7px 14px; font-size:13px; font-weight:500; cursor:pointer; font-family:'DM Sans',sans-serif;
  }

  .meals-container { padding:14px; }
  .meal-section { background:var(--surface); border-radius:16px; margin-bottom:10px; border:1px solid var(--border); overflow:visible; box-shadow:var(--shadow); }
  .meal-header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; cursor:pointer; user-select:none; }
  .meal-title { display:flex; align-items:center; gap:8px; }
  .meal-emoji { font-size:18px; }
  .meal-name { font-family:'Fraunces',serif; font-size:16px; font-weight:600; }
  .meal-pts { font-size:12px; color:var(--text2); background:var(--surface2); padding:3px 10px; border-radius:99px; font-weight:500; }
  .meal-body { padding:0 16px 14px; }
  .meal-body.collapsed { display:none; }

  .food-item { display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); animation:slideIn 0.2s ease; }
  .food-item:last-child { border-bottom:none; }
  @keyframes slideIn { from { opacity:0; transform:translateY(-5px); } to { opacity:1; transform:translateY(0); } }
  .food-name { font-size:14px; font-weight:500; }
  .food-portion { font-size:11px; color:var(--text2); margin-top:1px; }
  .food-pts-badge { font-family:'Fraunces',serif; font-size:17px; font-weight:600; color:var(--accent); min-width:32px; text-align:right; margin-right:8px; }
  .pts-zero { color:var(--green); }
  .delete-btn { background:none; border:none; color:#ccc; cursor:pointer; font-size:16px; padding:2px 4px; border-radius:6px; transition:color 0.2s; }
  .delete-btn:hover { color:var(--red); }

  .add-form { margin-top:10px; background:var(--surface2); border-radius:12px; padding:12px; position:relative; }
  .add-form-title { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text2); margin-bottom:8px; }

  .search-wrap { position:relative; margin-bottom:8px; }
  .search-input {
    width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:10px;
    font-family:'DM Sans',sans-serif; font-size:14px; background:var(--surface);
    color:var(--text); outline:none; transition:border 0.2s;
  }
  .search-input:focus { border-color:var(--accent); }

  .autocomplete-list {
    position:absolute; top:calc(100% + 4px); left:0; right:0;
    background:var(--surface); border:1.5px solid var(--accent);
    border-radius:12px; z-index:9999; max-height:220px; overflow-y:auto;
    box-shadow:0 8px 24px rgba(0,0,0,0.14); display:none;
  }
  .autocomplete-item {
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 14px; cursor:pointer; border-bottom:1px solid var(--border); transition:background 0.1s;
  }
  .autocomplete-item:last-child { border-bottom:none; }
  .autocomplete-item:hover, .autocomplete-item.ac-active { background:#fff5f0; }
  .ac-name { font-size:14px; font-weight:500; }
  .ac-portion { font-size:11px; color:var(--text2); }
  .ac-pts { font-family:'Fraunces',serif; font-size:16px; font-weight:600; color:var(--accent); white-space:nowrap; margin-left:8px; }
  .ac-pts-zero { color:var(--green) !important; }

  .manual-row { display:none; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  .manual-row input {
    flex:1; min-width:80px; padding:9px 11px; border:1.5px solid var(--border); border-radius:9px;
    font-family:'DM Sans',sans-serif; font-size:13px; background:var(--surface); color:var(--text); outline:none;
  }
  .manual-row input:focus { border-color:var(--accent); }
  .pts-input { max-width:72px !important; }
  .add-btn {
    background:var(--accent); color:#fff; border:none; border-radius:9px;
    padding:9px 14px; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap;
  }
  .manual-toggle { font-size:11px; color:var(--text2); cursor:pointer; text-decoration:underline; }

  .quick-foods { margin-top:8px; }
  .quick-label { font-size:11px; color:var(--text2); margin-bottom:5px; text-transform:uppercase; letter-spacing:1px; }
  .quick-chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip {
    background:var(--surface); border:1.5px solid var(--border); border-radius:99px;
    padding:4px 10px; font-size:12px; cursor:pointer; color:var(--text); transition:all 0.15s;
  }
  .chip:hover { border-color:var(--accent); color:var(--accent); background:#fff5f0; }
  .chip-pts { color:var(--accent); font-weight:600; }
  .chip-pts-zero { color:var(--green); font-weight:600; }

  .settings-btn {
    position:fixed; bottom:22px; right:20px; background:var(--accent); color:#fff;
    border:none; border-radius:50%; width:52px; height:52px; font-size:20px; cursor:pointer;
    box-shadow:0 4px 20px rgba(200,90,42,0.4); z-index:200; transition:transform 0.2s;
  }
  .settings-btn:hover { transform:scale(1.08) rotate(20deg); }

  .modal-overlay {
    position:fixed; inset:0; background:rgba(26,20,16,0.5); z-index:300;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.25s;
  }
  .modal-overlay.open { opacity:1; pointer-events:all; }
  .modal {
    background:var(--surface); border-radius:24px 24px 0 0; padding:22px 22px 38px;
    width:100%; max-width:480px; transform:translateY(100%);
    transition:transform 0.3s cubic-bezier(.34,1.56,.64,1);
  }
  .modal-overlay.open .modal { transform:translateY(0); }
  .modal h2 { font-family:'Fraunces',serif; font-size:20px; margin-bottom:16px; }
  .modal label { display:block; font-size:13px; color:var(--text2); margin-bottom:4px; margin-top:12px; }
  .modal input {
    width:100%; padding:11px 13px; border:1.5px solid var(--border); border-radius:11px;
    font-size:15px; font-family:'DM Sans',sans-serif; background:var(--surface2); outline:none; color:var(--text);
  }
  .modal input:focus { border-color:var(--accent); }
  .modal-save {
    margin-top:18px; width:100%; background:var(--accent); color:#fff; border:none;
    border-radius:13px; padding:15px; font-size:15px; font-weight:500;
    font-family:'DM Sans',sans-serif; cursor:pointer;
  }
  .modal-close { float:right; background:var(--surface2); border:none; border-radius:99px; padding:5px 12px; font-size:12px; cursor:pointer; color:var(--text2); font-family:'DM Sans',sans-serif; }

  .history-section { padding:0 14px 80px; }
  .history-title { font-family:'Fraunces',serif; font-size:18px; margin-bottom:10px; color:var(--text2); }
  .history-week { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .day-pill { background:var(--surface); border:1.5px solid var(--border); border-radius:11px; padding:7px 3px; text-align:center; cursor:pointer; transition:all 0.15s; }
  .day-pill.today { border-color:var(--accent); background:#fff5f0; }
  .day-pill .day-name { font-size:10px; color:var(--text2); text-transform:uppercase; }
  .day-pill .day-pts { font-family:'Fraunces',serif; font-size:15px; font-weight:600; color:var(--accent); margin-top:2px; }
  .day-pill .day-pts.over { color:var(--red); }
  .day-pill .day-pts.empty { color:var(--border); }

  /* ===== STRECKKOD & NÄRING ===== */
  .scan-btn {
    display:flex; align-items:center; gap:6px;
    background:var(--accent); color:#fff; border:none; border-radius:10px;
    padding:10px 14px; font-family:'DM Sans',sans-serif; font-size:13px;
    font-weight:500; cursor:pointer; margin-bottom:8px; width:100%;
    justify-content:center; transition:background 0.2s;
  }
  .scan-btn:hover { background:#b04a1e; }
  .scan-btn:disabled { background:#ccc; cursor:not-allowed; }

  .scanner-modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.85);
    z-index:1000; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.2s;
  }
  .scanner-modal-overlay.open { opacity:1; pointer-events:all; }
  .scanner-box {
    position:relative; width:min(90vw,360px);
    background:#000; border-radius:20px; overflow:hidden;
  }
  #scannerVideo { width:100%; display:block; max-height:60vh; object-fit:cover; }
  .scanner-frame {
    position:absolute; inset:0; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
  }
  .scanner-frame::before {
    content:''; display:block;
    width:65%; height:30%;
    border:2.5px solid #fff;
    border-radius:8px;
    box-shadow:0 0 0 9999px rgba(0,0,0,0.45);
  }
  .scanner-line {
    position:absolute; left:18%; right:18%;
    height:2px; background:var(--accent);
    animation:scan 2s ease-in-out infinite;
  }
  @keyframes scan {
    0%,100%{top:35%} 50%{top:65%}
  }
  .scanner-label {
    color:#fff; font-size:13px; margin-top:14px; opacity:0.8; text-align:center;
  }
  .scanner-close {
    margin-top:16px; background:rgba(255,255,255,0.15); color:#fff;
    border:none; border-radius:99px; padding:10px 28px;
    font-size:14px; cursor:pointer; font-family:'DM Sans',sans-serif;
  }

  /* Product result card after scan */
  .product-card {
    background:var(--surface); border-radius:16px; padding:16px;
    margin-top:8px; border:2px solid var(--accent); animation:slideIn 0.25s ease;
  }
  .product-card-name { font-family:'Fraunces',serif; font-size:16px; font-weight:600; margin-bottom:4px; }
  .product-card-brand { font-size:12px; color:var(--text2); margin-bottom:10px; }
  .nutrition-grid {
    display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px;
  }
  .nutr-box { background:var(--surface2); border-radius:9px; padding:7px 4px; text-align:center; }
  .nutr-val { font-family:'Fraunces',serif; font-size:15px; font-weight:600; color:var(--accent); }
  .nutr-lbl { font-size:10px; color:var(--text2); margin-top:1px; }
  .product-pts-big {
    font-family:'Fraunces',serif; font-size:32px; font-weight:600;
    color:var(--accent); text-align:center; margin-bottom:4px;
  }
  .product-pts-big.pts-zero { color:var(--green); }
  .product-pts-label { font-size:12px; color:var(--text2); text-align:center; margin-bottom:12px; }
  .product-add-btn {
    width:100%; background:var(--accent); color:#fff; border:none; border-radius:11px;
    padding:13px; font-size:15px; font-weight:500; cursor:pointer;
    font-family:'DM Sans',sans-serif; transition:background 0.2s;
  }
  .product-add-btn:hover { background:#b04a1e; }
  .scan-error { color:var(--red); font-size:13px; text-align:center; padding:10px; }

  /* Nutrition line under food items */
  .food-nutr { font-size:10px; color:var(--text2); margin-top:2px; }

  /* Nutrition summary under meal header */
  .meal-nutr-summary {
    display:flex; align-items:center; justify-content:center;
    gap:6px; padding:6px 16px 8px;
    background:var(--surface2);
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }
  .meal-nutr-item { display:flex; align-items:baseline; gap:3px; }
  .meal-nutr-val { font-family:'Fraunces',serif; font-size:14px; font-weight:600; color:var(--text); }
  .meal-nutr-lbl { font-size:10px; color:var(--text2); text-transform:uppercase; letter-spacing:0.5px; }
  .meal-nutr-sep { color:var(--border); font-size:14px; }

  /* Daily totals row on points card */
  .daily-nutr-row {
    display:grid; grid-template-columns:repeat(4,1fr);
    gap:6px; margin-top:12px; padding-top:12px;
    border-top:1px solid var(--border);
  }
  .daily-nutr-box { text-align:center; }
  .daily-nutr-val { font-family:'Fraunces',serif; font-size:16px; font-weight:600; color:var(--text); }
  .daily-nutr-lbl { font-size:10px; color:var(--text2); text-transform:uppercase; letter-spacing:0.5px; margin-top:1px; }
</style>
<!-- ZXing barcode scanner -->
<script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
</head>
<body>

<!-- Scanner modal -->
<div class="scanner-modal-overlay" id="scannerModal">
  <div class="scanner-box">
    <video id="scannerVideo" playsinline muted></video>
    <div class="scanner-frame"><div class="scanner-line"></div></div>
  </div>
  <div class="scanner-label">Håll streckkoden inom ramen</div>
  <button class="scanner-close" onclick="closeScanner()">Avbryt</button>
</div>

<header>
  <h1>🌿 Min Matdagbok</h1>
  <div class="date-nav">
    <button onclick="changeDay(-1)">&#8249;</button>
    <div id="currentDate"></div>
    <button onclick="changeDay(1)">&#8250;</button>
  </div>
</header>

<!-- Scan bar always visible below header -->
<div style="background:#fff5f0;border-bottom:1px solid #e8c8b8;padding:10px 14px;display:flex;align-items:center;gap:10px;">
  <button onclick="openScannerPrompt()" style="flex:1;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;">
    <span style="font-size:18px">📷</span> Skanna streckkod
  </button>
</div>
<div id="scan-meal-picker" style="display:none;background:#fff;border-bottom:1px solid var(--border);padding:10px 14px;">
  <div style="font-size:12px;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;">Lägg till i vilken måltid?</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <button onclick="openScanner('frukost')" style="flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:9px;padding:9px 6px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;">🌅 Frukost</button>
    <button onclick="openScanner('lunch')" style="flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:9px;padding:9px 6px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;">☀️ Lunch</button>
    <button onclick="openScanner('middag')" style="flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:9px;padding:9px 6px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;">🌙 Middag</button>
    <button onclick="openScanner('mellis')" style="flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:9px;padding:9px 6px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;">🍎 Mellis</button>
  </div>
</div>

<div class="points-card">
  <div class="points-stats">
    <div class="stat-box budget"><div class="val" id="budgetDisplay">23</div><div class="lbl">Budget</div></div>
    <div class="stat-box eaten"><div class="val" id="eatenDisplay">0</div><div class="lbl">Ätet</div></div>
    <div class="stat-box left" id="leftBox"><div class="val" id="leftDisplay">23</div><div class="lbl">Kvar</div></div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="daily-nutr-row" id="dailyNutrRow" style="display:none">
    <div class="daily-nutr-box"><div class="daily-nutr-val" id="dnKcal">0</div><div class="daily-nutr-lbl">kcal</div></div>
    <div class="daily-nutr-box"><div class="daily-nutr-val" id="dnProtein">0g</div><div class="daily-nutr-lbl">protein</div></div>
    <div class="daily-nutr-box"><div class="daily-nutr-val" id="dnCarbs">0g</div><div class="daily-nutr-lbl">kolhydr.</div></div>
    <div class="daily-nutr-box"><div class="daily-nutr-val" id="dnFat">0g</div><div class="daily-nutr-lbl">fett</div></div>
  </div>
</div>

<div class="bonus-strip">
  <div style="display:flex;align-items:center;gap:10px">
    <span style="font-size:20px">⭐</span>
    <div class="bonus-text">Veckobonus<span id="bonusDisplay">49 pts kvar</span></div>
  </div>
  <button class="bonus-btn" onclick="useBonus()">Använd</button>
</div>

<div class="meals-container" id="mealsContainer"></div>

<div class="history-section">
  <div class="history-title">Veckans översikt</div>
  <div class="history-week" id="weekView"></div>
</div>

<button class="settings-btn" onclick="openSettings()">&#9881;&#65039;</button>

<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>Inställningar <button class="modal-close" onclick="closeSettings()">Stäng</button></h2>
    <label>Dagligt punktbudget</label>
    <input type="number" id="budgetInput" value="23" min="1" max="100">
    <label>Veckobonus (extra points)</label>
    <input type="number" id="weeklyBonusInput" value="23" min="0" max="200">
    <label>Ditt namn</label>
    <input type="text" id="nameInput" placeholder="T.ex. Anna">
    <button class="modal-save" onclick="saveSettings()">&#128190; Spara</button>
  </div>
</div>

<script>
const FOOD_DB = [
  {name:'Kvarg 0,2%',portion:'100g',pts:0,kcal:60,protein:10,carbs:4,fat:0},
  {name:'Kvarg 0,2%, stor portion',portion:'200g',pts:0,kcal:120,protein:20,carbs:8,fat:0},
  {name:'Kvarg 0,2%, liten portion',portion:'50g',pts:0,kcal:30,protein:5,carbs:2,fat:0},
  {name:'Skyr, naturell',portion:'100g',pts:0,kcal:63,protein:11,carbs:4,fat:0},

function dateKey(d){return d.toISOString().split('T')[0];}
function getDay(d){
  const k=dateKey(d);
  if(!state.days[k]) state.days[k]={meals:{frukost:[],lunch:[],middag:[],mellis:[]}};
  return state.days[k];
}
function save(){localStorage.setItem('vv_state3',JSON.stringify(state));}
function totalEaten(d){return Object.values(getDay(d).meals).flat().reduce((s,f)=>s+f.pts,0);}

function render(){renderHeader();renderPoints();renderMeals();renderWeek();}

function renderHeader(){
  const dn=['Sön','Mån','Tis','Ons','Tor','Fre','Lör'];
  const mn=['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
  const d=currentDate;
  document.getElementById('currentDate').textContent=`${dn[d.getDay()]} ${d.getDate()} ${mn[d.getMonth()]}`;
}

function renderPoints(){
  const eaten=totalEaten(currentDate), budget=state.dailyBudget, left=budget-eaten;
  const pct=Math.min(100,(eaten/budget)*100);
  document.getElementById('budgetDisplay').textContent=budget;
  document.getElementById('eatenDisplay').textContent=eaten;
  document.getElementById('leftDisplay').textContent=Math.abs(left);
  const lb=document.getElementById('leftBox'), bar=document.getElementById('progressBar');
  if(left<0){lb.classList.add('over');lb.querySelector('.lbl').textContent='Över budget';bar.classList.add('over');}
  else{lb.classList.remove('over');lb.querySelector('.lbl').textContent='Kvar';bar.classList.remove('over');}
  bar.style.width=pct+'%';
  document.getElementById('bonusDisplay').textContent=(state.weeklyBonus-(state.weeklyBonusUsed||0))+' pts kvar';

  // Daily nutrition totals – show whenever items exist after migration
  const allItems = Object.values(getDay(currentDate).meals).flat();
  const hasNutr = allItems.some(f => 'kcal' in f);
  const row = document.getElementById('dailyNutrRow');
  if(hasNutr && allItems.length){
    const totKcal    = allItems.reduce((s,f)=>s+(f.kcal||0),0);
    const totProtein = allItems.reduce((s,f)=>s+(f.protein||0),0);
    const totCarbs   = allItems.reduce((s,f)=>s+(f.carbs||0),0);
    const totFat     = allItems.reduce((s,f)=>s+(f.fat||0),0);
    document.getElementById('dnKcal').textContent    = Math.round(totKcal);
    document.getElementById('dnProtein').textContent = Math.round(totProtein*10)/10+'g';
    document.getElementById('dnCarbs').textContent   = Math.round(totCarbs*10)/10+'g';
    document.getElementById('dnFat').textContent     = Math.round(totFat*10)/10+'g';
    row.style.display='grid';
  } else {
    row.style.display='none';
  }
}

// --- LIVSMEDELSVERKET API ---
const LV_API = 'https://dataportal.livsmedelsverket.se/livsmedel/api/v1/livsmedel';
let lvSearchTimer = null;

async function searchLV(query) {
  try {
    const url = `${LV_API}?sovring=${encodeURIComponent(query)}&sprak=1&offset=0&max=8`;
    const res = await fetch(url, {headers:{'Accept':'application/json'}});
    if(!res.ok) return [];
    const data = await res.json();

    // Handle different response shapes
    const items = Array.isArray(data) ? data :
                  data.livsmedel ? data.livsmedel :
                  data.data ? data.data : [];

    return items.map(item => {
      // Näringsvärden kan heta olika saker – prova alla kända strukturer
      const nvList = item.naringsvarden || item.naringsinnehall || item.nutrients || [];

      // Hjälpfunktion: leta efter näringsvärde på känd kod/namn
      const get = (...keys) => {
        for(const key of keys) {
          const v = nvList.find(x =>
            (x.naringId||x.kod||x.nearingsId||x.nutrientId||'').toString().toLowerCase() === key.toLowerCase() ||
            (x.namn||x.name||x.nutrientName||'').toString().toLowerCase().includes(key.toLowerCase())
          );
          if(v) return Math.round((v.varde||v.value||0)*10)/10;
        }
        return 0;
      };

      const kcal  = get('Enerc','energi kcal','energy','kcal');
      const prot  = get('Prot','protein');
      const carbs = get('Choavl','kolhydrat','carbohydrate','kh');
      const fat   = get('Fat','fett','lipid');
      const satFat= get('Fasat','mättat fett','saturated');
      const sugar = get('Sugar','socker','sugars');
      const fiber = get('Fibt','fiber','kostfiber');

      const pts = calcWWPoints(kcal, satFat, sugar, prot, fiber);

      return {
        name: item.namn || item.livsmedelsNamn || item.name || 'Okänt',
        portion: '100g',
        pts: pts !== null ? Math.max(0,pts) : 0,
        kcal: Math.round(kcal),
        protein: prot,
        carbs: carbs,
        fat: fat,
        fromLV: true,
      };
    }).filter(f => f.name !== 'Okänt');
  } catch(e) {
    console.warn('LV API error:', e);
    return [];
  }
}

function onSearch(mealId){
  const q=document.getElementById(`fsearch-${mealId}`).value.trim();
  const list=document.getElementById(`aclist-${mealId}`);
  acMatches[mealId]={idx:-1,items:[]};
  if(q.length<1){list.style.display='none';return;}

  // Show local results immediately
  const localMatches=FOOD_DB.filter(f=>f.name.toLowerCase().includes(q.toLowerCase())).slice(0,6);
  acMatches[mealId].items=localMatches;
  if(localMatches.length){
    renderAcList(mealId, localMatches, q, false);
  } else {
    list.innerHTML='<div style="padding:10px 14px;color:var(--text2);font-size:13px;">🔍 Söker...</div>';
    list.style.display='block';
  }

  // Debounce LV API call after 2+ chars
  if(q.length < 2) return;
  clearTimeout(lvSearchTimer);
  lvSearchTimer = setTimeout(async () => {
    const lvResults = await searchLV(q);
    // Merge: local first, then LV results not already in local
    const localNames = localMatches.map(f=>f.name.toLowerCase());
    const newLV = lvResults.filter(f=>!localNames.includes(f.name.toLowerCase()));
    const merged = [...localMatches, ...newLV].slice(0,14);
    acMatches[mealId].items = merged;
    renderAcList(mealId, merged, q, true);
  }, 350);
}

  if(!acMatches[mealId])acMatches[mealId]={idx:-1,items:[]};

  const list=document.getElementById(`aclist-${mealId}`);
  if(list.style.display==='none')return;
  const m=acMatches[mealId]||{idx:-1,items:[]};
  if(e.key==='ArrowDown'){e.preventDefault();setAcActive(mealId,Math.min(m.idx+1,m.items.length-1));}
  else if(e.key==='ArrowUp'){e.preventDefault();setAcActive(mealId,Math.max(m.idx-1,0));}
  else if(e.key==='Enter'){e.preventDefault();if(m.idx>=0)selectAc(mealId,m.idx);}
  else if(e.key==='Escape'){list.style.display='none';}
}

// ===== WW POINTS FORMULA =====
// Based on: calories, saturated fat, sugar, protein, fiber
function calcWWPoints(kcal, satFat, sugar, protein, fiber){
  if(isNaN(kcal)||isNaN(protein)) return null;
  const sf = satFat||0, s = sugar||0, p = protein||0, f = fiber||0;
  const pts = (kcal*0.0305) - (p*0.275) + (sf*0.098) + (s*0.12) - (f*0.12);
  return Math.max(0, Math.round(pts));
}

// ===== OPEN FOOD FACTS =====
async function lookupBarcode(barcode){
  try {
    const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
    const data = await res.json();
    if(data.status !== 1) return null;
    const p = data.product;
    const n = p.nutriments || {};
    const per100 = {
      kcal: Math.round(n['energy-kcal_100g'] || n['energy_100g']/4.184 || 0),
      protein: Math.round((n.proteins_100g||0)*10)/10,
      carbs: Math.round((n.carbohydrates_100g||0)*10)/10,
      fat: Math.round((n.fat_100g||0)*10)/10,
      satFat: n['saturated-fat_100g']||0,
      sugar: n.sugars_100g||0,
      fiber: n.fiber_100g||0,
    };
    const servingSize = p.serving_size || '100g';
    const servingG = parseFloat(p.serving_quantity || 100) || 100;
    const ratio = servingG / 100;
    const perServing = {
      kcal: Math.round(per100.kcal * ratio),
      protein: Math.round(per100.protein * ratio * 10)/10,
      carbs: Math.round(per100.carbs * ratio * 10)/10,
      fat: Math.round(per100.fat * ratio * 10)/10,
    };
    const pts = calcWWPoints(
      per100.kcal * ratio,
      per100.satFat * ratio,
      per100.sugar * ratio,
      per100.protein * ratio,
      per100.fiber * ratio
    );
    return {
      name: p.product_name || p.product_name_sv || 'Okänd produkt',
      brand: p.brands || '',
      portion: servingSize,
      kcal: perServing.kcal,
      protein: perServing.protein,
      carbs: perServing.carbs,
      fat: perServing.fat,
      pts: pts !== null ? pts : 0,
      barcode,
    };
  } catch(e) {
    return null;
  }
}

// ===== SCANNER STATE =====
let scannerMealId = null;
let codeReader = null;
let scannerActive = false;

function openScannerPrompt(){

function openScanner(mealId){

  scannerMealId = mealId;
  document.getElementById('scannerModal').classList.add('open');
  startScanner();
}

function closeScanner(){
  document.getElementById('scannerModal').classList.remove('open');
  stopScanner();
}

function stopScanner(){
  if(codeReader){ try{ codeReader.reset(); }catch(e){} codeReader=null; }
  const v = document.getElementById('scannerVideo');
  if(v && v.srcObject){ v.srcObject.getTracks().forEach(t=>t.stop()); v.srcObject=null; }
  scannerActive = false;
}

async function startScanner(){
  if(scannerActive) return;
  scannerActive = true;
  const video = document.getElementById('scannerVideo');

  try {
    // Step 1: getUserMedia FIRST – this triggers Safari's permission prompt
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }
    });
    video.srcObject = stream;
    video.setAttribute('playsinline', true);
    await video.play();

    // Step 2: Try ZXing if loaded (best barcode support)
    if(window.ZXing){
      // Stop the manual stream, let ZXing take over
      stream.getTracks().forEach(t => t.stop());
      video.srcObject = null;
      try {
        codeReader = new ZXing.BrowserMultiFormatReader();
        await codeReader.decodeFromConstraints(
          { video: { facingMode: { ideal: 'environment' } } },
          video,
          async (result, err) => {
            if(result && scannerActive){
              const barcode = result.getText();
              await handleBarcode(barcode);
              closeScanner();
            }
          }
        );
        return;
      } catch(zxingErr) {
        // ZXing failed, fall through to BarcodeDetector
        try { codeReader && codeReader.reset(); } catch(e){}
        codeReader = null;
        // Restart stream for fallback
        const s2 = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } }
        });
        video.srcObject = s2;
        await video.play();
      }
    }

    // Step 3: BarcodeDetector fallback (works on Chrome/Android, not Safari)
    if('BarcodeDetector' in window){
      const detector = new BarcodeDetector({
        formats: ['ean_13','ean_8','upc_a','upc_e','code_128','qr_code']
      });
      const tick = async () => {
        if(!scannerActive) return;
        try {
          const barcodes = await detector.detect(video);
          if(barcodes.length){
            await handleBarcode(barcodes[0].rawValue);
            closeScanner();
            return;
          }
        } catch(e){}
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
      return;
    }

    // Step 4: Safari fallback – show manual barcode input
    showScanError(scannerMealId,
      'Automatisk skanning stöds ej i din webbläsare. Kameran är öppen – håll streckkoden framför kameran och ange koden manuellt nedan.');
    // Show manual barcode input
    const resultDiv = document.getElementById(`product-result-${scannerMealId}`);
    if(resultDiv){
      const mid = scannerMealId;
      resultDiv.innerHTML += `
        <div style="margin-top:8px;display:flex;gap:8px;">
          <input id="manual-barcode" type="number" placeholder="Ange streckkod (EAN-13)"
            style="flex:1;padding:10px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;font-family:'DM Sans',sans-serif;">
          <button onclick="lookupManualBarcode('${mid}')"
            style="background:var(--accent);color:#fff;border:none;border-radius:9px;padding:10px 14px;font-size:14px;cursor:pointer;">Sök</button>
        </div>`;
    }
    closeScanner();

  } catch(e) {
    scannerActive = false;
    let msg = 'Kameran kunde inte startas.';
    if(e.name === 'NotAllowedError'){
      msg = 'Kamerabehörighet nekad. Gå till Inställningar → Safari → Kamera → välj "Fråga".';
    } else if(e.name === 'NotFoundError'){
      msg = 'Ingen kamera hittades på enheten.';
    }
    showScanError(scannerMealId, msg);
    closeScanner();
  }
}

function migrateNutrition(){

        if(item.kcal === undefined){
          const db = FOOD_DB.find(f => f.name === item.name);
          if(db && db.kcal !== undefined){
            items[idx] = {...item, kcal:db.kcal, protein:db.protein, carbs:db.carbs, fat:db.fat};
            changed = true;
          }
        }
      });
    });
  });
  if(changed){ save(); console.log('Migration: nutrition enriched'); }
}

// Run migration BEFORE first render so nutrition shows immediately
migrateNutrition();
render();
if(state.name)document.querySelector('header h1').textContent=`🌿 ${state.name}s Matdagbok`;

// Register service worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// Install banner for iOS
window.addEventListener('load', () => {
  const isIos = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
  const isStandalone = window.navigator.standalone;
  const dismissed = localStorage.getItem('pwa_install_dismissed');
  if(isIos && !isStandalone && !dismissed){
    setTimeout(()=>{
      const banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#1a1410;color:#fff;padding:16px 20px 32px;z-index:9999;font-family:DM Sans,sans-serif;font-size:13px;display:flex;align-items:center;gap:12px;';
      banner.innerHTML = `
        <span style="font-size:28px">🌿</span>
        <div style="flex:1">
          <div style="font-weight:600;margin-bottom:3px">Installera Matdagbok</div>
          <div style="opacity:0.7">Tryck på <strong>Dela</strong> ↑ och sedan <strong>"Lägg till på hemskärmen"</strong></div>
        </div>
        <button onclick="this.parentElement.remove();localStorage.setItem('pwa_install_dismissed','1')" 
          style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:4px">✕</button>`;
      document.body.appendChild(banner);
    }, 2000);
  }
});
</script>
